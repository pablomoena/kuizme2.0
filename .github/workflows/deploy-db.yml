name: Migraciones a Supabase

# Las migraciones las aplica el pipeline, nunca una persona a mano. En la v1 los
# cambios de esquema se hacían desde un editor y hubo correcciones por SQL
# directo que nunca quedaron versionadas: git dejó de ser la fuente de verdad.
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

concurrency:
  group: db-deploy
  cancel-in-progress: false

jobs:
  push:
    name: supabase db push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Enlazar el proyecto
        run: supabase link --project-ref "$PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: bmsefapphatpqtufbife

      # Primero en seco: qué migraciones se aplicarían, antes de tocar nada.
      #
      # Era `supabase db diff --linked`, que tardaba dos minutos levantando una
      # base sombra y volcaba el esquema completo — nadie leía eso. `db push
      # --dry-run` imprime exactamente la lista que se va a aplicar, que es lo
      # que se revisa de verdad, y tarda segundos.
      - name: Qué se aplicaría
        run: supabase db push --include-all --dry-run --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # `--yes` no es cosmético. Sin él, `db push` PREGUNTA:
      #
      #   Do you want to push these migrations to the remote database?
      #    • 20260828080000_controles_inscripcion.sql
      #    [Y/n]
      #
      # En CI nadie contesta, y funcionaba porque el CLI lee fin-de-entrada y
      # asume el valor por omisión, que hoy es "sí". Es decir: las migraciones se
      # aplicaban gracias a un defecto del CLI y no porque este workflow lo
      # pidiera. Si una versión cambiara ese defecto a "abortar", el deploy
      # dejaría de aplicar nada. Ahora se pide explícito.
      - name: Aplicar migraciones
        run: supabase db push --include-all --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
