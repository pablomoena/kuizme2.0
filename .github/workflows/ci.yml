name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tipos, lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key-para-build
          NEXT_PUBLIC_ROOT_DOMAIN: kuizme.com

  schema:
    name: Esquema y comportamiento
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kuizme
          POSTGRES_PASSWORD: kuizme
          POSTGRES_DB: kuizme_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: kuizme
      PSQL: psql -h localhost -U kuizme -d kuizme_test -v ON_ERROR_STOP=1
    steps:
      - uses: actions/checkout@v5
      # Solo para el generador de tipos, que usa módulos nativos de Node y psql.
      # No hace falta `npm ci`.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Aplica el esquema completo desde cero en una base limpia. Si una
      # migración no corre, CI falla acá y no en producción. La v1 no tenía esto.
      - name: Aplicar migraciones desde cero
        run: |
          $PSQL -f tests/db/stubs.sql
          for f in supabase/migrations/*.sql; do
            echo "── $f"
            $PSQL -f "$f"
          done

      # Los tipos se generan del esquema, no se escriben a mano: si alguien
      # cambia una migración y no los regenera, falla acá y no con un error en
      # tiempo de ejecución meses después.
      #
      # El resultado no depende de si las suites ya corrieron: sus helpers viven
      # en el esquema `test` y el generador solo mira `public`. Estuvieron en
      # public un rato y hacían que los tipos cambiaran según el orden de los
      # pasos — el chequeo fallaba sin que nada estuviera mal.
      - name: Tipos al día con el esquema
        run: npm run db:types:check
        env:
          DATABASE_URL: postgresql://kuizme:kuizme@localhost:5432/kuizme_test

      # Y comprueba que las decisiones de diseño FUNCIONAN, no solo que compilan.
      - name: Verificar invariantes contra la base
        run: $PSQL -f tests/db/schema-behavior.sql

      # El activo central: dos organizaciones, sesiones reales de usuario, y la
      # afirmación de que el tenant A no alcanza nada del tenant B.
      - name: Aislamiento entre tenants
        run: $PSQL -f tests/db/tenant-isolation.sql

      # D7 · Dentro de una misma organización, un alumno solo alcanza lo que le
      # corresponde. La suite de aislamiento cubre tenant contra tenant; esta
      # cubre el agujero que había dentro del tenant.
      - name: Acceso a contenido
        run: $PSQL -f tests/db/content-access.sql

      # Atomicidad y permisos al reordenar. Lo que se protege: que un alumno
      # reciba un error y no un éxito silencioso — con RLS un UPDATE sin permiso
      # no falla, simplemente no toca filas.
      - name: Reordenar módulos y lecciones
        run: $PSQL -f tests/db/reorder.sql

      # D9 · Que no se pueda fabricar progreso, y que el progreso tenga una sola
      # definición. Un alumno sin matrícula llegaba a marcar completadas
      # lecciones de cursos que no podía ni ver, incluidos borradores.
      - name: Progreso y lecciones completadas
        run: $PSQL -f tests/db/progress.sql

      # D10 · La entrega configurada por curso, aplicada en la base. Cada
      # comprobación mira la puerta Y el contenido que llega: que la puerta diga
      # "no" y el contenido llegue igual sería el fallo que esto busca.
      - name: Modos de entrega del contenido
        run: $PSQL -f tests/db/release-modes.sql

      # D11 · Las dos vías de matrícula, y sobre todo lo que el alumno NO puede
      # hacer de paso: ponerse nota, marcarse el curso completado, entrar gratis
      # en uno de pago, o aprobar su propia solicitud.
      - name: Matrícula
        run: $PSQL -f tests/db/matricula.sql

      # D12 · Inscripción abierta, plazo y cupo. Las tres columnas existían en la
      # v1 y ninguna funcionaba de verdad.
      - name: Controles de inscripción
        run: $PSQL -f tests/db/controles-inscripcion.sql

      # La carrera del cupo necesita DOS conexiones solapadas, así que no cabe en
      # un archivo .sql. Sin el `for update` del trigger, entran dos alumnos en un
      # cupo de uno — verificado quitándolo.
      - name: Carrera del cupo
        run: ./tests/db/race-cupo.sh
        env:
          PGPASSWORD: kuizme

      # Va al final: traspasa la propiedad de todas las tablas y funciones a un
      # rol sin bypassrls, así que deja la base inservible para otras pruebas.
      - name: Independencia de los privilegios del dueño
        run: $PSQL -f tests/db/owner-privileges.sql

  e2e:
    name: Extremo a extremo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # El e2e corre contra la build de producción, no contra `next dev`: es el
      # modo en que se sirve de verdad, y el dev server esconde diferencias de
      # render y de caché.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key-para-e2e
          NEXT_PUBLIC_ROOT_DOMAIN: localhost

      # Playwright arranca el servidor (ver webServer en playwright.config.ts).
      - run: npx playwright test --project=escritorio

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
