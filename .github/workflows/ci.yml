name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tipos, lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key-para-build
          NEXT_PUBLIC_ROOT_DOMAIN: kuizme.com

  schema:
    name: Esquema y comportamiento
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kuizme
          POSTGRES_PASSWORD: kuizme
          POSTGRES_DB: kuizme_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: kuizme
      PSQL: psql -h localhost -U kuizme -d kuizme_test -v ON_ERROR_STOP=1
    steps:
      - uses: actions/checkout@v5

      # Aplica el esquema completo desde cero en una base limpia. Si una
      # migración no corre, CI falla acá y no en producción. La v1 no tenía esto.
      - name: Aplicar migraciones desde cero
        run: |
          $PSQL -f tests/db/stubs.sql
          for f in supabase/migrations/*.sql; do
            echo "── $f"
            $PSQL -f "$f"
          done

      # Y comprueba que las decisiones de diseño FUNCIONAN, no solo que compilan.
      - name: Verificar invariantes contra la base
        run: $PSQL -f tests/db/schema-behavior.sql

      # El activo central: dos organizaciones, sesiones reales de usuario, y la
      # afirmación de que el tenant A no alcanza nada del tenant B.
      - name: Aislamiento entre tenants
        run: $PSQL -f tests/db/tenant-isolation.sql

      # D7 · Dentro de una misma organización, un alumno solo alcanza lo que le
      # corresponde. La suite de aislamiento cubre tenant contra tenant; esta
      # cubre el agujero que había dentro del tenant.
      - name: Acceso a contenido
        run: $PSQL -f tests/db/content-access.sql

      # Va al final: traspasa la propiedad de todas las tablas y funciones a un
      # rol sin bypassrls, así que deja la base inservible para otras pruebas.
      - name: Independencia de los privilegios del dueño
        run: $PSQL -f tests/db/owner-privileges.sql
